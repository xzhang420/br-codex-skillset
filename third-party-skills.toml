# Third-party Codex skills mirrored into this repo.
# The biweekly update automation reads this file, checks upstreams, and reports
# candidate updates. Third-party entries may be auto-applied and pushed only by the primary update device when all guardrails pass.

primary_update_device = "personal"
third_party_update_policy = "primary-device-auto-apply-and-push"
own_skill_update_policy = "manual-confirm-before-commit-or-push"
other_device_policy = "pull-shared-repo-only"

[[skills]]
name = "frontend-slides"
local_path = "skills/frontend-slides"
upstream_url = "https://github.com/zarazhangrui/frontend-slides"
source_type = "github"
tracking = "default-branch-or-release"
current_source = "local copy imported before 2026-07-09; exact upstream commit unknown"

preserve_rules = [
  "Keep only the top-level Codex skill at skills/frontend-slides.",
  "Do not reintroduce .claude-plugin or plugins/frontend-slides nested packaging.",
  "Keep upstream LICENSE and README when syncing source files.",
  "Run git diff --check after preparing any candidate update."
]

